<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />

    <script>
      /* Terapkan tema sebelum halaman digambar supaya tidak ada kedipan putih. */
      (function () {
        try {
          var stored = localStorage.getItem('apisz-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#f2f0eb' : '#0a0a0b');
        } catch (e) {
          /* localStorage diblokir: tetap dark */
        }
      })();
    </script>

    <title>APISZ STORE — Digital Service &amp; SA-MP Service</title>
    <meta
      name="description"
      content="APISZ STORE menyediakan jasa Discord, Custom Bot, Website, SA-MP, Textdraw, Filescript, Mapping, dan layanan digital lainnya dengan harga terjangkau."
    />
    <meta name="author" content="APISZ STORE" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://apiszstore.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="APISZ STORE" />
    <meta property="og:title" content="APISZ STORE — Digital Service &amp; SA-MP Service" />
    <meta
      property="og:description"
      content="Jasa Discord, Custom Bot, Website, SA-MP dengan harga terjangkau untuk pelajar."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:url" content="https://apiszstore.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="APISZ STORE — Digital Service &amp; SA-MP Service" />
    <meta
      name="twitter:description"
      content="Jasa Discord, Custom Bot, Website, SA-MP dengan harga terjangkau untuk pelajar."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

        "description": "Digital service store yang menyediakan layanan Discord, development, website, dan SA-MP dengan harga terjangkau.",
        "slogan": "Digital Service & SA-MP Service",

      }
    </script>
  </head>

    <script type="module" src="/src/main.jsx"></script>

</html>
