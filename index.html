<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#313338" />

    <!-- Font: Sora (judul) + Plus Jakarta Sans (isi) + JetBrains Mono (kode) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>APISZ STORE — Digital Service &amp; SA-MP Solutions</title>
    <meta
      name="description"
      content="APISZ STORE menyediakan layanan Discord, Custom Bot, Website, SA-MP, dan produk digital dengan harga terjangkau."
    />
    <meta name="author" content="APISZ STORE" />
    <meta name="robots" content="index, follow" />
    <!-- Canonical / og:url / JSON-LD url
         FIXME: ini masih URL sementara (Cloudflare Pages). Ganti ke domain
         asli di 3 tempat ini sekaligus kalau domain sudah siap:
           1. <link rel="canonical">
           2. <meta property="og:url">
           3. "url" di JSON-LD
         Jalankan: npm run check:url  untuk memastikan ketiganya sinkron. -->
    <link rel="canonical" href="https://apiszstore.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="APISZ STORE" />
    <meta property="og:title" content="APISZ STORE — Digital Service &amp; SA-MP Solutions" />
    <meta
      property="og:description"
      content="Layanan Discord, Custom Bot, Website, SA-MP, dan produk digital dengan harga terjangkau."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://apiszstore.pages.dev/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="APISZ STORE — Digital Service &amp; SA-MP Solutions" />
    <meta
      name="twitter:description"
      content="Layanan Discord, Custom Bot, Website, SA-MP, dan produk digital dengan harga terjangkau."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicon: nilai bawaan. src/lib/brand.js akan menggantinya dengan
         src/config/site.js -> brand.favicon kalau file-nya tersedia. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "APISZ STORE",
        "alternateName": "APISZ Digital Service",
        "description": "Digital service store untuk kebutuhan Discord, development, website, dan SA-MP.",
        "slogan": "Digital Service & SA-MP Solutions",
        "url": "https://apiszstore.pages.dev/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Website ini membutuhkan JavaScript. Silakan hubungi APISZ STORE melalui Discord.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
